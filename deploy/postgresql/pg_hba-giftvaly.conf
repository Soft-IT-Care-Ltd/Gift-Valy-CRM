# Gift Valy's lines in /etc/postgresql/18/main/pg_hba.conf (DEPLOYMENT.md
# step 3). The Antu repo's deploy/postgresql/pg_hba.conf is the file installed
# on the server, so these lines belong there too — a re-install from it must
# keep them. Each copy's roles reach only its own database; neither reaches
# Antu's or the admin panel's, and their roles never reach these.
#
# TYPE  DATABASE          USER                                          ADDRESS        METHOD
local   giftvaly          giftvaly_owner,giftvaly_app                                  scram-sha-256
host    giftvaly          giftvaly_owner,giftvaly_app                   127.0.0.1/32   scram-sha-256
host    giftvaly          giftvaly_owner,giftvaly_app                   ::1/128        scram-sha-256
local   giftvaly_staging  giftvaly_staging_owner,giftvaly_staging_app                  scram-sha-256
host    giftvaly_staging  giftvaly_staging_owner,giftvaly_staging_app   127.0.0.1/32   scram-sha-256
host    giftvaly_staging  giftvaly_staging_owner,giftvaly_staging_app   ::1/128        scram-sha-256
