# /etc/nginx/sites-available/giftvaly-shop.conf — Gift Valy's website
# (ROUND3 W-10): giftvaly.com → the production app on 127.0.0.1:3200, and
# www.giftvaly.com → a 301 to the bare name. It is the same app as the ERP
# behind dashboard.funnelliner.com: the app tells the website from the ERP by
# the Host header alone (STOREFRONT_HOSTS in the production .env,
# lib/storefront/hosts.ts), so this file only adds the names.
#
# Antu's antuboutique.com blocks (antu-crm.conf), adapted. Behind Cloudflare
# (zone giftvaly.com, proxied, Full (strict)) with one Let's Encrypt
# certificate for both names by webroot (DEPLOYMENT.md step 5d). The same
# real-IP, body-size and timeout rules as the dashboard block:
# antu-app-proxy.conf passes `Host $host` (the order endpoint's same-site
# check compares Origin with Host) and X-Real-IP (the order limits count by it).
# /go/ and /_c/ belong to the Funnel Liner proxy (CLAUDE.md rule 7): never
# answered on the website, not even /_c/giftvaly/ — machines use
# dashboard.funnelliner.com/_c/giftvaly/.
# No root or alias: Nginx never serves UPLOAD_DIR or INVOICE_DIR (GV-11).

server {
    listen 80;
    listen [::]:80;
    server_name giftvaly.com;
    include snippets/cloudflare-real-ip.conf;
    include snippets/acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.giftvaly.com;
    include snippets/cloudflare-real-ip.conf;
    include snippets/acme-challenge.conf;
    location / { return 301 https://giftvaly.com$request_uri; }
}

server {
    listen 443 ssl http2;        # Ubuntu 24.04 ships Nginx 1.24 — `http2 on;` needs 1.25.1+
    listen [::]:443 ssl http2;
    server_name giftvaly.com;
    ssl_certificate     /etc/letsencrypt/live/giftvaly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giftvaly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/cloudflare-real-ip.conf;
    client_max_body_size 12m;
    include snippets/acme-challenge.conf;   # a check that followed Cloudflare's redirect to https

    location /_c/ { return 404; }
    location /go/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3200;
        include snippets/antu-app-proxy.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.giftvaly.com;
    ssl_certificate     /etc/letsencrypt/live/giftvaly.com/fullchain.pem;   # the same certificate names both
    ssl_certificate_key /etc/letsencrypt/live/giftvaly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/cloudflare-real-ip.conf;
    client_max_body_size 12m;
    include snippets/acme-challenge.conf;
    location / { return 301 https://giftvaly.com$request_uri; }
}
