# /etc/nginx/sites-available/giftvaly-staging.conf — Gift Valy STAGING
# (FUNNEL_LINER.md GV-14): gv-staging.funnelliner.com → the staging app on
# 127.0.0.1:3210, never production's :3200. Production has no site file of its
# own: it is reached through dashboard.funnelliner.com (the Antu repo's
# antu-crm.conf, GV-16).
#
# The same shape as Antu's antu-staging.conf, so staging tests the same
# routing: /_c/giftvaly/ for machines (prefix stripped), any other /_c/ and
# /go/ → 404. Behind Cloudflare (orange cloud, Full (strict)) with a Let's
# Encrypt certificate by webroot (snippets/acme-challenge.conf). Every HTTPS
# block includes giftvaly-staging-guard.conf: a password and noindex.
# No root or alias: Nginx never serves UPLOAD_DIR or INVOICE_DIR (GV-11).
# Uses Antu's snippets: cloudflare-real-ip.conf, acme-challenge.conf,
# antu-app-proxy.conf (real IP headers, 600 s timeouts).

server {
    listen 80;
    listen [::]:80;
    server_name gv-staging.funnelliner.com;
    include snippets/cloudflare-real-ip.conf;
    include snippets/acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;        # Ubuntu 24.04 ships Nginx 1.24 — `http2 on;` needs 1.25.1+
    listen [::]:443 ssl http2;
    server_name gv-staging.funnelliner.com;
    ssl_certificate     /etc/letsencrypt/live/gv-staging.funnelliner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gv-staging.funnelliner.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/cloudflare-real-ip.conf;
    # Uploads are at most 5 MB (app/api/uploads); the margin is the form around them.
    client_max_body_size 12m;
    include snippets/acme-challenge.conf;
    include snippets/giftvaly-staging-guard.conf;

    # Machines (the Steadfast webhook, admin-staging): the shop code, stripped.
    location /_c/giftvaly/ {
        proxy_pass http://127.0.0.1:3210/;
        include snippets/antu-app-proxy.conf;
    }
    location /_c/ { return 404; }
    location /go/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3210;
        include snippets/antu-app-proxy.conf;
    }
}
