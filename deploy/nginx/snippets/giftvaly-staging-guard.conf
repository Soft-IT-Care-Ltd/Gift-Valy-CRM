# /etc/nginx/snippets/giftvaly-staging-guard.conf — included by the HTTPS
# server block of giftvaly-staging.conf only. A password before the app is
# reached, and search engines told to stay out. The credentials are made by
# scripts/staging-auth.sh, run by the owner; until then the file is empty and
# every request gets a 401.
#
# /_c/giftvaly/ is behind the password too, as on Antu's staging: on the
# server, admin-staging calls http://localhost:3210 directly, and a webhook
# test on staging is a curl to 127.0.0.1:3210 (DEPLOYMENT.md step 12).

auth_basic           "Gift Valy staging";
auth_basic_user_file /etc/nginx/giftvaly-staging.htpasswd;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

location = /robots.txt {
    auth_basic off;
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 200 "User-agent: *\nDisallow: /\n";
}

# The PWA files hold nothing private, and browsers fetch the manifest without
# credentials — behind the password, "install the app" would fail on staging.
location ~ ^/(manifest\.webmanifest|sw\.js|offline\.html|icons/) {
    auth_basic off;
    proxy_pass http://127.0.0.1:3210;
    include snippets/antu-app-proxy.conf;
}
