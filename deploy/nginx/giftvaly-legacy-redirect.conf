# /etc/nginx/sites-available/giftvaly-legacy-redirect.conf — app.giftvaly.com,
# the old server's address (FUNNEL_LINER.md GV-14), only redirects: 301 to
# https://dashboard.funnelliner.com, so old bookmarks and installed PWAs land
# in the right place. It serves nothing else.
#
# ONLY needed if app.giftvaly.com's DNS is pointed at this server. The plan
# (GO_LIVE.md) is a Cloudflare Redirect Rule in the giftvaly.com zone instead,
# which needs no file here at all. Installing this one also needs a
# certificate for app.giftvaly.com (DEPLOYMENT.md step 5b).
#
# The path is dropped on purpose: old app.giftvaly.com links carry the old
# server's ids, which mean nothing on the new database.

server {
    listen 80;
    listen [::]:80;
    server_name app.giftvaly.com;
    include snippets/cloudflare-real-ip.conf;
    include snippets/acme-challenge.conf;
    location / { return 301 https://dashboard.funnelliner.com/; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.giftvaly.com;
    ssl_certificate     /etc/letsencrypt/live/app.giftvaly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.giftvaly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/cloudflare-real-ip.conf;
    include snippets/acme-challenge.conf;
    location / { return 301 https://dashboard.funnelliner.com/; }
}
