# /etc/nginx/sites-available/giftvaly-shop-staging.conf — Gift Valy's STAGING
# website (ROUND3 W-10): shop-staging.giftvaly.com → the staging app on
# 127.0.0.1:3210, never production's :3200. It is the same app as
# gv-staging.funnelliner.com: the app tells the website from the ERP by the
# Host header alone (STOREFRONT_HOSTS in the staging .env, lib/storefront/
# hosts.ts), so this file only adds a name.
#
# Antu's staging-shop block, adapted. Behind Cloudflare (zone giftvaly.com,
# proxied, Full (strict)) with its own Let's Encrypt certificate by webroot
# (DEPLOYMENT.md step 5c). The same password and noindex as gv-staging —
# giftvaly-staging-guard.conf, one staging password for both names — and the
# same real-IP, body-size and timeout rules: antu-app-proxy.conf passes
# `Host $host` (the order endpoint's same-site check compares Origin with
# Host) and X-Real-IP (the order limits count by it).
# /go/ and /_c/ belong to the Funnel Liner proxy (CLAUDE.md rule 7): never
# answered on the website, not even /_c/giftvaly/ — machines use gv-staging.
# No root or alias: Nginx never serves UPLOAD_DIR or INVOICE_DIR (GV-11).

server {
    listen 80;
    listen [::]:80;
    server_name shop-staging.giftvaly.com;
    include snippets/cloudflare-real-ip.conf;
    include snippets/acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;        # Ubuntu 24.04 ships Nginx 1.24 — `http2 on;` needs 1.25.1+
    listen [::]:443 ssl http2;
    server_name shop-staging.giftvaly.com;
    ssl_certificate     /etc/letsencrypt/live/shop-staging.giftvaly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop-staging.giftvaly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/cloudflare-real-ip.conf;
    client_max_body_size 12m;
    include snippets/acme-challenge.conf;   # a check that followed Cloudflare's redirect to https
    include snippets/giftvaly-staging-guard.conf;

    location /_c/ { return 404; }
    location /go/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3210;
        include snippets/antu-app-proxy.conf;
    }
}
